server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gestion des routes React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gestion des fichiers statiques
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }
}